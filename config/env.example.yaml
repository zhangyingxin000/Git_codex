project:
  name: AutoTest AI
  env: soulfree-test
  base_url: https://test2westarlive.gzxchate.com

tools:
  jmeter:
    home: D:/apache-jmeter-5.6.3
    default_mode: gui
    open_gui_after_generate: true
  newman:
    enabled: true
    collection_dir: reports/tool-assets

features:
  ai_hallucination_check: true
  db_evidence_check: true
  redis_evidence_check: true
  jmeter_gui_launch: true
  postman_newman_chain: true

execution:
  retry_times: 1
  timeout_seconds: 120
  strict_assertions: true

data_sources:
  mysql:
    readonly: true
    host: ""
    port: 3306
    database: ""
  redis:
    readonly: true
    host: ""
    port: 6379
    db: 0
    ssl: false

accounts:
  strategy: csv_or_login_or_redis
  data_owner: test_case_decision
  csv_root: data
  roles: [applicant, proxy, wealth_user, operator]

requirement_datasets:
  salary_trade:
    name: 工资代理快速结算
    account_csv_path: data/salary-trade-accounts.csv
    applicant_csv_path: data/salary-trade-applicants.csv
    flow_slots_csv_path: data/salary-trade-flow-slots.csv
    runtime_properties_path: work/salary-trade-runtime.properties
    result_jtl_path: D:/apache-jmeter-5.6.3/jmx/20260826/工资代理结算-result.jtl
  wealth_level:
    name: 财富等级
    runtime_csv_path: data/wealth-level-runtime.csv
    result_jtl_path: D:/apache-jmeter-5.6.3/jmx/20260826/性能基线-result.jtl

reports:
  root: reports
  group_by: requirement_package
  keep_raw_jtl: true
