project:
  name: AutoTest AI
  env: soulfree-test
  base_url: https://test2westarlive.gzxchate.com

tools:
  jmeter:
    # Prefer AUTOTEST_JMETER_HOME or AUTOTEST_JMETER on a new machine.
    home: ${AUTOTEST_JMETER_HOME}
    engine: mcp
    default_mode: non_gui
    open_gui_after_generate: false
    mcp:
      enabled: true
      package: jmeter-mcp-server@0.3.1
      bridge: tools/jmeter-mcp/bridge.mjs
      workspace: work/jmeter-mcp
  newman:
    enabled: true
    collection_dir: reports/tool-assets
  apifox_cli:
    enabled: false
    # Each requirement package keeps its exact command in apifox/cli-profile.yaml.
    token_env: APIFOX_ACCESS_TOKEN
    timeout_seconds: 300

features:
  ai_hallucination_check: true
  db_evidence_check: true
  redis_evidence_check: true
  jmeter_gui_launch: true
  postman_newman_chain: true

execution:
  # real_test permits writes through business APIs only. Direct MySQL/Redis evidence remains readonly.
  mode: readonly
  allow_mutations: false
  allow_high_risk: false
  allowed_hosts: []
  retry_times: 1
  timeout_seconds: 120
  strict_assertions: true

data_sources:
  mysql:
    readonly: true
    host: ""
    port: 3306
    database: ""
  redis:
    readonly: true
    host: ""
    port: 6379
    db: 0
    ssl: false

accounts:
  strategy: csv_or_login_or_redis
  data_owner: test_case_decision
  csv_root: data
  roles: [applicant, proxy, wealth_user, operator]

requirement_datasets:
  salary_trade:
    name: 工资代理快速结算
    account_csv_path: data/salary-trade-accounts.csv
    applicant_csv_path: data/salary-trade-applicants.csv
    flow_slots_csv_path: data/salary-trade-flow-slots.csv
    runtime_properties_path: work/salary-trade-runtime.properties
    result_jtl_path: reports/latest/salary-trade-result.jtl
  wealth_level:
    name: 财富等级
    jmeter_plan_path: jmeter/wealth-level-performance.jmx
    runtime_csv_path: data/wealth-level-runtime.csv
    result_jtl_path: reports/latest/wealth-level-result.jtl

reports:
  root: reports
  group_by: requirement_package
  keep_raw_jtl: true
  keep_latest_complete_runs: 10
  retention_days: 30
  keep_latest_per_type: 5
  archive_after_days: 14
  delete_after_days: 0
  archive_mode: index_only
