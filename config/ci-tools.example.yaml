schema_version: "1.0"
stages:
  - name: salary-trade-newman-smoke
    tool: newman
    enabled: false
    required: true
    collection: requirements/salary-trade/outputs/newman/postman-collection.json
    environment: ""
    timeout_seconds: 600
    args: []

  - name: salary-trade-jmeter-baseline
    tool: jmeter
    enabled: false
    required: true
    jmx: requirements/salary-trade/outputs/jmeter/load-test/stage-01-baseline.jmx
    timeout_seconds: 900
    args: []

  # Paste the argument portion generated by Apifox CI/CD here. Keep tokens in
  # environment variables such as ${APIFOX_ACCESS_TOKEN}; never write them here.
  - name: apifox-release-smoke
    tool: apifox
    enabled: false
    required: true
    executable: npx
    timeout_seconds: 900
    args:
      - apifox-cli
      - --version
    artifacts: []
