name: Generate detect-secrets baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Create baseline
        run: detect-secrets scan > .secrets.baseline || true
      - name: Commit and push baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .secrets.baseline
          git commit -m "chore: generate detect-secrets baseline" || echo "No changes to commit"
          git push origin HEAD:ci/add-workflows
