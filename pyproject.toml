[project]
name = "autotest-ai-quality-hub"
version = "0.1.0"
description = "AI-driven quality hub for enterprise-recognized test orchestration."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "redis>=5.0",
  "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["quality_hub_backend*"]
