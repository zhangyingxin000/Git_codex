schema_version: "1.0"
package_id: demo-salary-trade
resources:
  - id: demo_accounts
    kind: csv
    path: data/accounts.csv
    required: true
  - id: demo_contract
    kind: openapi
    path: openapi.json
    required: true
  - id: demo_replay
    kind: replay
    path: replay/scenarios.json
    required: true
  - id: demo_database
    kind: sqlite
    path: seed.sqlite
    generated: false
    immutable: true
  - id: demo_runtime_database
    kind: sqlite
    path: reports/latest/runtime.sqlite
    generated: true
    git_ignored: true
safety:
  network: localhost_only
  mutations: local_sqlite_only
  credentials: synthetic_only
